services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Takiii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NahBroo}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_user} -d ${POSTGRES_DB:-crypto_dw}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: crypto_dw_postgres_data
