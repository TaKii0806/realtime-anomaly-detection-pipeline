[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-anomaly-detection-pipeline"
version = "0.1.0"
description = "Real-time anomaly detection pipeline on crypto trade streams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["legacy", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
